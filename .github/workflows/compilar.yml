name: Compilar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AforoTanque2026.zip'
      - '.github/workflows/compilar.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Descomprimir proyecto
        run: |
          rm -rf project
          mkdir project
          unzip -q AforoTanque2026.zip -d project
          ROOT=$(find project -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$ROOT" ]; then
            echo "No se encontró settings.gradle.kts"
            exit 1
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Revisar proyecto Android
        run: |
          echo "===== app/build.gradle.kts ====="
          cat "$ROOT/app/build.gradle.kts"
          echo "===== settings.gradle.kts ====="
          cat "$ROOT/settings.gradle.kts"
          echo "===== MainActivity.java ====="
          cat "$ROOT/app/src/main/java/com/aforotanque2026/MainActivity.java"

      - name: Compilar APK Debug
        run: |
          cd "$ROOT"
          gradle assembleDebug --stacktrace

      - name: Comprobar APK generado
        run: |
          echo "===== APK GENERADO ====="
          ls -lh "$ROOT/app/build/outputs/apk/debug/"
          echo "===== RUTA Y TAMAÑO ====="
          stat "$ROOT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: AforoTanque2026-debug
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error